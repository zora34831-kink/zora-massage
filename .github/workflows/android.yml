
name: ZORA MASSAGE - Build 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build User APK
        run: gradle :app:assembleDebug

      - name: Build Admin APK
        run: gradle :admin-app:assembleDebug

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORA-MASSAGE-USER
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORA-MASSAGE-ADMIN
          path: admin-app/build/outputs/apk/debug/*.apk
          
