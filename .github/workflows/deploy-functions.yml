
name: ZORA MASSAGE BACKEND

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        working-directory: functions
        run: npm install

      - name: Configure Firebase Credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Set Owner Custom Claim
        env:
          ZORA_OWNER_UID: ${{ secrets.ZORA_OWNER_UID }}
        run: |
          node <<'NODE'
          const admin = require("./functions/node_modules/firebase-admin");

          async function main() {
            const uid = process.env.ZORA_OWNER_UID;

            if (!uid) {
              throw new Error("ZORA_OWNER_UID belum diatur.");
            }

            admin.initializeApp({
              credential: admin.credential.applicationDefault()
            });

            const user = await admin.auth().getUser(uid);

            await admin.auth().setCustomUserClaims(uid, {
              ...(user.customClaims || {}),
              owner: true
            });

            console.log("Owner custom claim berhasil diatur.");
            await admin.app().delete();
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project zora-massage --non-interactive
        
